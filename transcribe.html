<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>تفريغ الصوت — ادرس معي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/transcribe.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<script>
(function(){ try{
  var cfg = JSON.parse(localStorage.getItem('adrisma3i_cfg_v1')||'{}');
  var theme = cfg.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  document.documentElement.setAttribute('data-theme', theme);
}catch(e){} })();
</script>
</head>
<body>
<header id="topbar"></header>
<nav id="tabnav"></nav>
<div id="page-root">
  <div class="page-scroll">
    <div class="page-pad tr-pad">
      <p class="tr-desc">ارفع أي تسجيل صوتي — محاضرة، اجتماع، ملاحظة صوتية — ويسمعه بدقة عالية ويحوّله لنص مكتوب ومرتب.</p>

      <div class="tr-upload">
        <input type="file" id="tr-file-input" hidden accept="audio/*">
        <button class="btn btn-accent" id="tr-pick-btn">اختر ملف صوتي</button>
        <div id="tr-status" class="tr-status"></div>
      </div>

      <div id="tr-result-wrap" class="hidden">
        <div class="tr-result-head">
          <h3>النص المفرّغ</h3>
          <div class="tr-actions">
            <button class="btn btn-ghost btn-sm" id="tr-save-btn">حفظ بالملاحظات</button>
            <button class="btn btn-ghost btn-sm" id="tr-copy-btn">نسخ</button>
            <button class="btn btn-ghost btn-sm" id="tr-print-btn">طباعة</button>
            <button class="btn btn-ghost btn-sm" id="tr-download-btn">تنزيل .txt</button>
          </div>
        </div>
        <div id="tr-text" class="tr-text" contenteditable="true" spellcheck="false"></div>
        <p class="tr-hint">تقدر تعدّل النص مباشرة هون قبل ما تنسخه أو تطبعه.</p>
      </div>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>
<div id="modals-mount"></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/storage.js"></script>
<script src="js/gemini.js"></script>
<script src="js/ui.js"></script>
<script src="js/shared.js"></script>
<script src="js/transcribe.js"></script>
</body>
</html>
