<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول بالكود</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  padding:20px
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:28px;
  backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,.3)
}

h1{
  margin:0 0 10px;
  text-align:center;
  font-size:28px
}

p{
  text-align:center;
  color:#cbd5e1;
  margin:0 0 24px
}

input{
  width:100%;
  padding:16px;
  border:1px solid #475569;
  border-radius:14px;
  background:#0f172a;
  color:#fff;
  font-size:18px;
  text-align:center;
  outline:none;
  letter-spacing:2px
}

input:focus{
  border-color:#60a5fa
}

button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

#message{
  min-height:24px;
  text-align:center;
  margin-top:16px;
  font-weight:bold;
  line-height:1.6
}

.info{
  margin-top:18px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  font-size:13px;
  color:#cbd5e1;
  text-align:center
}
</style>
</head>

<body>

<div class="card">

  <h1>تسجيل الدخول</h1>

  <p>أدخل كود التفعيل للمتابعة</p>

  <form id="loginForm">

    <input
      id="codeInput"
      type="text"
      autocomplete="off"
      spellcheck="false"
      maxlength="14"
      placeholder="XXXX-XXXX-XXXX"
      required
    >

    <button id="submitBtn" type="submit">
      تفعيل الكود
    </button>

  </form>

  <div id="message"></div>

  <div class="info">
    صلاحية الكود تبدأ من لحظة تفعيله
    وتستمر لمدة شهر كامل.
  </div>

</div>

<script>

/* ==========================================
   إعدادات النظام
========================================== */

const VERIFY_URL =
  "https://vhcietifebbqlyxhryyf.supabase.co/functions/v1/verify-code";

const DESTINATION =
  "home.html";


/* ==========================================
   تنظيف الكود
========================================== */

function normalizeCode(value){

  return value
    .trim()
    .toUpperCase();

}


/* ==========================================
   إنشاء بصمة الجهاز
========================================== */

async function getDeviceFingerprint(){

  const components = [];

  components.push(
    navigator.userAgent || ""
  );

  components.push(
    navigator.language || ""
  );

  components.push(
    navigator.languages
      ? navigator.languages.join(",")
      : ""
  );

  components.push(
    screen.width || ""
  );

  components.push(
    screen.height || ""
  );

  components.push(
    screen.colorDepth || ""
  );

  components.push(
    window.devicePixelRatio || 1
  );

  try{

    components.push(
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone || ""
    );

  }catch(_){

    components.push("");

  }

  components.push(
    navigator.hardwareConcurrency || ""
  );

  components.push(
    navigator.deviceMemory || ""
  );

  components.push(
    navigator.platform || ""
  );

  components.push(
    navigator.maxTouchPoints || 0
  );


  /* Canvas fingerprint */

  try{

    const canvas =
      document.createElement("canvas");

    const ctx =
      canvas.getContext("2d");

    if(ctx){

      ctx.textBaseline = "top";

      ctx.font =
        "14px Arial";

      ctx.fillText(
        "ادرس معي - Device Fingerprint",
        2,
        2
      );

      components.push(
        canvas.toDataURL()
      );

    }

  }catch(_){

    components.push("");

  }


  const raw =
    components.join("|||");


  /* SHA-256 */

  try{

    const encoder =
      new TextEncoder();

    const data =
      await crypto.subtle.digest(
        "SHA-256",
        encoder.encode(raw)
      );

    const bytes =
      new Uint8Array(data);

    return Array
      .from(bytes)
      .map(
        b =>
          b.toString(16)
           .padStart(2,"0")
      )
      .join("");

  }catch(error){

    console.error(
      "Fingerprint error:",
      error
    );

    return null;

  }

}


/* ==========================================
   تنسيق الوقت المتبقي
========================================== */

function formatRemaining(ms){

  ms =
    Math.max(
      0,
      ms
    );

  const totalSeconds =
    Math.floor(
      ms / 1000
    );

  const days =
    Math.floor(
      totalSeconds / 86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    `${days} يوم، ` +
    `${hours} ساعة، ` +
    `${minutes} دقيقة، ` +
    `${seconds} ثانية`
  );

}


/* ==========================================
   عرض الصلاحية
========================================== */

function showRemaining(
  expiresAt,
  message
){

  const expiry =
    new Date(
      expiresAt
    ).getTime();

  const update = () => {

    const remaining =
      expiry - Date.now();

    if(
      remaining <= 0
    ){

      message.textContent =
        "⏰ انتهت صلاحية الكود.";

      message.style.color =
        "#f87171";

      return false;

    }

    message.textContent =
      "✅ الكود صالح — المتبقي: " +
      formatRemaining(
        remaining
      );

    message.style.color =
      "#4ade80";

    return true;

  };


  update();


  const timer =
    setInterval(
      () => {

        if(!update()){

          clearInterval(
            timer
          );

        }

      },
      1000
    );


  return timer;

}


/* ==========================================
   تسجيل الدخول
========================================== */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const input =
        document.getElementById(
          "codeInput"
        );

      const button =
        document.getElementById(
          "submitBtn"
        );

      const message =
        document.getElementById(
          "message"
        );


      const code =
        normalizeCode(
          input.value
        );


      message.textContent =
        "";

      button.disabled =
        true;

      button.textContent =
        "جارٍ التعرف على الجهاز...";


      /* =====================================
         التحقق من وجود كود مدخل
      ===================================== */

      if(!code){

        message.textContent =
          "❌ يرجى إدخال كود التفعيل.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

        return;

      }


      /* =====================================
         إنشاء بصمة الجهاز
      ===================================== */

      const deviceFingerprint =
        await getDeviceFingerprint();


      if(!deviceFingerprint){

        console.error(
          "DEVICE_FINGERPRINT_ERROR"
        );

        message.textContent =
          "❌ تعذر التعرف على الجهاز.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

        return;

      }


      console.log(
        "Device fingerprint generated successfully."
      );


      button.textContent =
        "جارٍ التحقق...";


      /* =====================================
         الاتصال بـ Supabase Edge Function
         
         ملاحظة:
         الكود نفسه لا يتم التحقق منه محلياً.
         السيرفر هو الذي يبحث عنه في قاعدة البيانات.
      ===================================== */

      try{

        const response =
          await fetch(
            VERIFY_URL,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  code:code,

                  device_fingerprint:
                    deviceFingerprint
                })
            }
          );


        let result;


        try{

          result =
            await response.json();

        }catch(_){

          throw new Error(
            "INVALID_SERVER_RESPONSE"
          );

        }


        /* ===================================
           أخطاء الخادم
        =================================== */

        if(!response.ok){

          console.error(
            "SERVER_ERROR:",
            result
          );

          message.textContent =
            "❌ " +
            (
              result.message ||
              "حدث خطأ في الخادم."
            );

          message.style.color =
            "#f87171";

          button.disabled =
            false;

          button.textContent =
            "تفعيل الكود";

          return;

        }


        /* ===================================
           الكود مرفوض
        =================================== */

        if(!result.valid){

          message.textContent =
            result.message ||
            "❌ تعذر تفعيل الكود.";

          message.style.color =
            "#f87171";

          button.disabled =
            false;

          button.textContent =
            "تفعيل الكود";

          return;

        }


        /* ===================================
           التفعيل ناجح
        =================================== */

        if(result.expiresAt){

          showRemaining(
            result.expiresAt,
            message
          );

        }else{

          message.textContent =
            "✅ تم تفعيل الكود بنجاح.";

          message.style.color =
            "#4ade80";

        }


        button.textContent =
          "تم التفعيل ✓";


        /* ===================================
           الانتقال للتطبيق
        =================================== */

        setTimeout(
          () => {

            window.location.replace(
              DESTINATION
            );

          },
          3000
        );

      }catch(error){

        console.error(
          "CONNECTION_ERROR:",
          error
        );

        message.textContent =
          "❌ تعذر الاتصال بالخادم.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

      }

    }
  );

</script>

</body>
</html>
