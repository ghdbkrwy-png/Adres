/* ==========================================
   تنظيف الكود
========================================== */

function normalizeCode(value){
  return value
    .trim()
    .toUpperCase();
}


/* ==========================================
   إنشاء بصمة الجهاز
========================================== */

async function getDeviceFingerprint(){

  const components = [];

  components.push(
    navigator.userAgent || ""
  );

  components.push(
    navigator.language || ""
  );

  components.push(
    navigator.languages
      ? navigator.languages.join(",")
      : ""
  );

  components.push(
    screen.width || ""
  );

  components.push(
    screen.height || ""
  );

  components.push(
    screen.colorDepth || ""
  );

  components.push(
    window.devicePixelRatio || 1
  );

  try{

    components.push(
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone || ""
    );

  }catch(_){

    components.push("");

  }

  components.push(
    navigator.hardwareConcurrency || ""
  );

  components.push(
    navigator.deviceMemory || ""
  );

  components.push(
    navigator.platform || ""
  );

  components.push(
    navigator.maxTouchPoints || 0
  );


  /* Canvas fingerprint */

  try{

    const canvas =
      document.createElement("canvas");

    const ctx =
      canvas.getContext("2d");

    if(ctx){

      ctx.textBaseline = "top";

      ctx.font =
        "14px Arial";

      ctx.fillText(
        "ادرس معي - Device Fingerprint",
        2,
        2
      );

      components.push(
        canvas.toDataURL()
      );

    }

  }catch(_){

    components.push("");

  }


  const raw =
    components.join("|||");


  /* SHA-256 */

  try{

    const encoder =
      new TextEncoder();

    const data =
      await crypto.subtle.digest(
        "SHA-256",
        encoder.encode(raw)
      );

    const bytes =
      new Uint8Array(data);

    return Array
      .from(bytes)
      .map(
        b =>
          b.toString(16)
           .padStart(2,"0")
      )
      .join("");

  }catch(error){

    console.error(
      "Fingerprint error:",
      error
    );

    return null;
  }
}


/* ==========================================
   تنسيق الوقت المتبقي
========================================== */

function formatRemaining(ms){

  ms =
    Math.max(
      0,
      ms
    );

  const totalSeconds =
    Math.floor(ms / 1000);

  const days =
    Math.floor(
      totalSeconds / 86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return (
    `${days} يوم، ` +
    `${hours} ساعة، ` +
    `${minutes} دقيقة، ` +
    `${seconds} ثانية`
  );
}


/* ==========================================
   عرض الصلاحية
========================================== */

function showRemaining(
  expiresAt,
  message
){

  const expiry =
    new Date(
      expiresAt
    ).getTime();

  const update = () => {

    const remaining =
      expiry - Date.now();

    if(
      remaining <= 0
    ){

      message.textContent =
        "⏰ انتهت صلاحية الكود.";

      message.style.color =
        "#f87171";

      return false;
    }

    message.textContent =
      "✅ الكود صالح — المتبقي: " +
      formatRemaining(
        remaining
      );

    message.style.color =
      "#4ade80";

    return true;
  };


  update();


  const timer =
    setInterval(
      () => {

        if(!update()){

          clearInterval(
            timer
          );

        }

      },
      1000
    );


  return timer;
}


/* ==========================================
   تسجيل الدخول
========================================== */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(e){

      e.preventDefault();


      const input =
        document.getElementById(
          "codeInput"
        );

      const button =
        document.getElementById(
          "submitBtn"
        );

      const message =
        document.getElementById(
          "message"
        );


      const code =
        normalizeCode(
          input.value
        );


      message.textContent =
        "";

      button.disabled =
        true;

      button.textContent =
        "جارٍ التعرف على الجهاز...";


      /* =====================================
         التحقق من الكود محلياً
      ===================================== */

      if(
        !VALID_CODES.includes(code)
      ){

        message.textContent =
          "❌ الكود غير صحيح.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

        return;
      }


      /* =====================================
         إنشاء بصمة الجهاز
      ===================================== */

      const deviceFingerprint =
        await getDeviceFingerprint();


      if(!deviceFingerprint){

        console.error(
          "DEVICE_FINGERPRINT_ERROR"
        );

        message.textContent =
          "❌ تعذر التعرف على الجهاز.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

        return;
      }


      console.log(
        "Device fingerprint generated successfully."
      );


      button.textContent =
        "جارٍ التحقق...";


      /* =====================================
         الاتصال بـ Supabase
      ===================================== */

      try{

        const response =
          await fetch(
            VERIFY_URL,
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  code:code,

                  device_fingerprint:
                    deviceFingerprint
                })
            }
          );


        let result;


        try{

          result =
            await response.json();

        }catch(_){

          throw new Error(
            "INVALID_SERVER_RESPONSE"
          );

        }


        /* ===================================
           أخطاء الخادم
        =================================== */

        if(!response.ok){

          console.error(
            "SERVER_ERROR:",
            result
          );

          message.textContent =
            "❌ " +
            (
              result.message ||
              "حدث خطأ في الخادم."
            );

          message.style.color =
            "#f87171";

          button.disabled =
            false;

          button.textContent =
            "تفعيل الكود";

          return;
        }


        /* ===================================
           الكود مرفوض
        =================================== */

        if(!result.valid){

          message.textContent =
            result.message ||
            "❌ تعذر تفعيل الكود.";

          message.style.color =
            "#f87171";

          button.disabled =
            false;

          button.textContent =
            "تفعيل الكود";

          return;
        }


        /* ===================================
           التفعيل ناجح
        =================================== */

        showRemaining(
          result.expiresAt,
          message
        );


        button.textContent =
          "تم التفعيل ✓";


        /* ===================================
           الانتقال للتطبيق
        =================================== */

        setTimeout(
          () => {

            window.location.replace(
              DESTINATION
            );

          },
          3000
        );

      }catch(error){

        console.error(
          "CONNECTION_ERROR:",
          error
        );

        message.textContent =
          "❌ تعذر الاتصال بالخادم.";

        message.style.color =
          "#f87171";

        button.disabled =
          false;

        button.textContent =
          "تفعيل الكود";

      }

    }
  );
